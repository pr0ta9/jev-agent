[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-agent"
version = "0.1.0"
description = "A decision model chooses, code executes, writers write only when prose is the product."
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx>=0.27", "pyyaml>=6", "jev-digest @ git+https://github.com/pr0ta9/jev-digest@97db6262551b9161339e4914b3eae253c25067af"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nyx = "soma.cli:main"

[tool.setuptools.packages.find]
include = ["soma*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
